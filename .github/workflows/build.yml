name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Patch the real Emby for Android APK and check the result with Google's own apksigner/zipalign.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build CLI
        run: dotnet build src/Enabler.Cli/Enabler.Cli.csproj -c Release
      - name: Download Emby for Android
        run: curl -fsSL -o emby.apk https://github.com/MediaBrowser/Emby.Releases/raw/master/android/emby-android-google-arm64-v8a-release.apk
      - name: Patch
        run: dotnet src/Enabler.Cli/bin/Release/net8.0/discover-enabler.dll emby.apk emby-discover.apk --key ci-key.pfx
      - name: Verify signature and alignment
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/apksigner" verify --verbose --print-certs emby-discover.apk
          "$BT/zipalign" -c -P 16 -v 4 emby-discover.apk | tail -3
          "$BT/aapt2" dump badging emby-discover.apk | head -5
      - name: Check patched files
        run: |
          unzip -p emby-discover.apk assets/www/index.html | grep -n "discover-web-loader.js"
          unzip -p emby-discover.apk assets/www/native/android/apphost.js | grep -n "restrictedplugins"
          unzip -l emby-discover.apk assets/www/discover-web-loader.js
          ls -l emby.apk emby-discover.apk
      - name: Download-and-patch mode (Fire TV build)
        run: |
          dotnet src/Enabler.Cli/bin/Release/net8.0/discover-enabler.dll --device firetv --out dl --key ci-key.pfx
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify dl/Emby-FireTV-Discover.apk && echo "fire tv OK"
      - name: Patch again (same key, already patched input)
        run: |
          dotnet src/Enabler.Cli/bin/Release/net8.0/discover-enabler.dll emby-discover.apk twice.apk --key ci-key.pfx
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify twice.apk && echo "re-patch OK"

  install-test:
    # Really install and start the patched app on an Android emulator (x86_64 build of the same Emby app).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build CLI and patch x86_64 APK
        run: |
          dotnet build src/Enabler.Cli/Enabler.Cli.csproj -c Release
          curl -fsSL -o emby.apk https://github.com/MediaBrowser/Emby.Releases/raw/master/android/emby-android-google-x86_64-release.apk
          dotnet src/Enabler.Cli/bin/Release/net8.0/discover-enabler.dll emby.apk patched.apk --key ci-key.pfx
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and start on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r emby.apk && echo "ORIGINAL INSTALL OK" && adb uninstall com.mb.android || true
            adb install -r patched.apk; echo "PATCHED INSTALL EXIT $?"
            adb shell pm list packages | grep mb.android || true
            adb shell monkey -p com.mb.android -c android.intent.category.LAUNCHER 1 || true
            sleep 15
            adb shell pidof com.mb.android && echo "APP RUNNING" || echo "APP NOT RUNNING"
            adb logcat -d | grep -iE "AndroidRuntime|FATAL|PackageManager|chromium|Console" | tail -60 || true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single exe
        run: dotnet publish src/Enabler.Gui/Enabler.Gui.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: DiscoverEnabler
          path: out/DiscoverEnabler.exe
      - name: Screenshot of the window
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath out/DiscoverEnabler.exe -PassThru
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/out/screenshot.png")
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: screenshot
          path: out/screenshot.png
          if-no-files-found: ignore

  cli:
    # Command-line version for Linux and macOS (one self-contained file each).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: |
          dotnet publish src/Enabler.Cli/Enabler.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:InvariantGlobalization=true -o out
          cp README.md out/
          chmod +x out/discover-enabler
          tar -czf discover-enabler-${{ matrix.rid }}.tar.gz -C out discover-enabler README.md
      - name: Smoke test
        if: matrix.rid == 'linux-x64'
        run: ./out/discover-enabler --help || test $? -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: discover-enabler-${{ matrix.rid }}.tar.gz

  test-builds:
    # Puts the latest test builds on branch exe-build (artifacts are not downloadable everywhere).
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [windows, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Push to exe-build
        run: |
          mkdir pub
          cp art/DiscoverEnabler/DiscoverEnabler.exe pub/
          cp art/cli-*/*.tar.gz pub/
          cp art/screenshot/screenshot.png pub/ 2>/dev/null || true
          cd pub
          git init -q -b exe-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Test builds from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" exe-build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Package
        run: |
          mkdir rel
          cp art/DiscoverEnabler/DiscoverEnabler.exe README.md .
          zip -q -9 rel/DiscoverEnabler-windows-x64.zip DiscoverEnabler.exe README.md
          cp art/cli-*/*.tar.gz rel/
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/*
          generate_release_notes: true
